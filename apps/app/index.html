<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#90a1b9" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <title>Dionysus Club | Preview</title>
  <script>
    // Set the dark class before first paint to avoid a light flash. Accent colors are applied in main.tsx.
    try {
      var theme = JSON.parse(localStorage.getItem('dionysus-settings') || '{}').state?.theme || 'system';
      if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
